name: findings

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pyyaml pytest
      - name: Check FINDINGS.md
        run: python scripts/check_findings.py
      - name: Test the checker
        run: python -m pytest -q tests/test_check_findings.py
